<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGIS MAPID - MapLibre Bootcamp</title>
    <!-- [Slide 3] Assets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <!-- Turf.js -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap");
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      #map {
        height: calc(100vh);
      }
      .glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body class="bg-slate-50 overflow-hidden text-slate-900 leading-tight">
    <nav
      class="h-20 bg-white border-b border-slate-100 flex items-center justify-between px-8 z-30 relative"
    >
      <div class="flex items-center gap-4">
        <div
          class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-black shadow-lg shadow-indigo-100 transform -rotate-2"
        >
          M
        </div>
        <div>
          <h1 class="text-lg font-extrabold tracking-tight">
            Webgis <span class="text-indigo-600">Mapid</span>
          </h1>
          <p
            class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5"
          >
            Mapid Bootcamp Academy
          </p>
        </div>
      </div>
    </nav>




    <div class="flex h-screen pt-0">
      <aside
        class="w-[350px] bg-white border-r border-slate-100 overflow-y-auto p-6 flex-shrink-0 z-20 scrollbar-hide"
      >
        <div class="space-y-10 pb-20">
          <!-- 1. BASEMAP STYLE -->
          <section>
            <h3
              class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4"
            >
              1. Basemap Style
            </h3>
            <div class="flex flex-col gap-2">
              <button
                id="btn-street"
                onclick="updateStyleToStreet()"
                class="text-left px-5 py-3 rounded-2xl border-2 border-slate-50 bg-slate-50 text-slate-500 text-[11px] font-black hover:bg-slate-100 transition-all"
              >
                MAPID Street
              </button>
              <button
                id="btn-dark"
                onclick="updateStyleToDark()"
                class="text-left px-5 py-3 rounded-2xl border-2 border-slate-50 bg-slate-50 text-slate-500 text-[11px] font-black hover:bg-slate-100 transition-all"
              >
                MAPID Dark
              </button>
              <button
                id="btn-satellite"
                onclick="updateStyleToSatellite()"
                class="text-left px-5 py-3 rounded-2xl border-2 border-slate-50 bg-slate-50 text-slate-500 text-[11px] font-black hover:bg-slate-100 transition-all"
              >
                MAPID Satellite
              </button>
            </div>
          </section>




          <!-- 2. POINT STYLING & FILTER -->
          <section>
            <h3
              class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4"
            >
              2. Point Styling
            </h3>
            <div class="bg-slate-50 rounded-3xl p-5 space-y-4">
              <div class="flex flex-col items-center justify-between gap-4">
                <div
                  class="flex flex-row w-full items-center justify-between gap-4"
                >
                  <div class="flex gap-2">
                    <div class="w-3 h-3 bg-blue-500 rounded-full"></div>
                    <span
                      class="text-[11px] font-black text-slate-700 uppercase"
                      >Apartement</span
                    >
                  </div>
                  <button
                    id="toggle-point-layer"
                    onclick="toggleLayerApartemen()"
                    class="w-10 h-10 flex items-center justify-center rounded-xl bg-white shadow-sm border border-slate-200 text-indigo-600 hover:bg-slate-100 transition-colors"
                  >
                    <svg
                      class="w-5 h-5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      ></path>
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      ></path>
                    </svg>
                  </button>
                </div>




                <!-- STYLING COLOR -->
                <div class="flex w-full items-center justify-between gap-4">
                  <label>Color</label>
                  <input
                    type="color"
                    oninput="setPaintApartemen(this.value)"
                    class="w-full rounded-lg"
                  />
                </div>




                <!-- STYLING OPACITY -->
                <div>
                  <label>Opacity</label>
                  <input
                    type="range"
                    min="0"
                    max="1"
                    step="0.1"
                    oninput="setPaintOpacityApartemen(parseFloat(this.value))"
                  />
                </div>




                <!-- FILTER DATA -->
                <div>
                  <select
                    onchange="filterApartemenKecamatan(this.value)"
                    class="w-full p-2 rounded-lg"
                  >
                    <option value="all">Semua Kecamatan</option>
                    <option value="COBLONG">Coblong</option>
                    <option value="SUKAJADI">Sukajadi</option>
                    <option value="CICENDO">Cicendo</option>
                  </select>
                </div>
              </div>
            </div>
          </section>




          <!-- 3. MULTI-GEOMETRY STYLING -->
          <section>
            <h3
              class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-4 italic"
            >
              2. Polygon Styling
            </h3>
            <!-- Polygon Controls -->
            <div
              class="p-5 bg-slate-50 border border-slate-100 rounded-3xl space-y-4 shadow-sm"
            >
              <div class="flex flex-col items-center justify-between">
                <div
                  class="flex flex-row w-full items-center justify-between gap-4"
                >
                  <div class="flex flex-row items-center gap-2">
                    <div class="w-3 h-3 bg-indigo-500 rounded-sm"></div>
                    <span
                      class="text-[11px] font-black text-indigo-900 uppercase"
                      >Batas Administrasi</span
                    >
                  </div>
                  <button
                    id="toggle-poly-layer"
                    onclick="toggleLayerAdministrasi()"
                    class="w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-indigo-200 text-indigo-600 shadow-sm"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      ></path>
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      ></path>
                    </svg>
                  </button>
                </div>




                <!-- styling color -->
                <div class="flex w-full items-center justify-between gap-4">
                  <label>Color</label>
                  <input
                    type="color"
                    oninput="setPaintAdministrasi(this.value)"
                    class="w-full rounded-lg"
                  />
                </div>




                <!-- opacity -->
                <div>
                  <label>Opacity</label>
                  <input
                    type="range"
                    min="0"
                    max="1"
                    step="0.1"
                    oninput="
                      setPaintOpacityAdministrasi(parseFloat(this.value))
                    "
                  />
                </div>
              </div>
            </div>
          </section>




          <section>
            <h3
              class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-4 italic"
            >
              3. Line Styling
            </h3>




            <!-- Line Controls -->
            <div
              class="p-5 bg-slate-50 border border-slate-100 rounded-3xl space-y-4 shadow-sm"
            >
              <div class="flex flex-col items-center justify-between w-full">
                <div
                  class="flex flex-row items-center gap-2 w-full justify-between"
                >
                  <div class="flex items-center gap-2">
                    <div class="w-3 h-0.5 bg-blue-500 rounded-full"></div>
                    <span
                      class="text-[11px] font-black text-blue-900 uppercase tracking-tight"
                      >Drainase</span
                    >
                  </div>
                  <button
                    id="toggle-line-layer"
                    onclick="toggleLayerDrainase()"
                    class="w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-blue-200 text-blue-600 shadow-sm"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      ></path>
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      ></path>
                    </svg>
                  </button>
                </div>




                <!-- styling color -->
                <div class="flex w-full items-center justify-between gap-4">
                  <label>Color</label>
                  <input
                    type="color"
                    oninput="setPaintDrainase(this.value)"
                    class="w-full rounded-lg"
                  />
                </div>

                <!-- tombol pindah ke area data drainase -->
                <button
                  onclick="zoomKeDrainase()"
                  class="w-full mt-3 py-2 rounded-lg bg-blue-600 text-white text-xs font-bold shadow-sm"
                >
                  Lihat Drainase (Yogyakarta)
                </button>
              </div>
            </div>
          </section>


          <!-- ISOCHONRE -->
           <section>
            <h3
              class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-4 italic"
            >
              4. Isochrone Tools
            </h3>


            <div class="flex flex-col gap-2 p-2">
                <div class="flex flex-col gap-2">
                    <label>Mode Transportasi</label>
                    <select id="transportasi" class="w-full p-3 rounded-xl bg-white border border-slate-200 text-[11px] font-black text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                        <option value="foot">Kaki</option>
                        <option value="motorcycle">Motor</option>
                    </select>
                </div>
                <div class="flex flex-col gap-2">
                    <label>Waktu (detik)</label>
                    <input type="number" min="0" max="1000" value="300" id="waktu"
                                class="w-full p-3 rounded-xl bg-white border border-slate-200 text-[11px] font-black text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 transition-all"
                   
                    >
                </div>


                <button id="button-run" class="w-full py-4 bg-indigo-600 text-white rounded-2xl text-[11px] font-black uppercase tracking-widest shadow-lg shadow-indigo-100 hover:bg-indigo-700 active:scale-95 transition-all flex items-center justify-center">Jalankan Analisis</button>


                <div>
                    <label>Hasil</label>
                    <div class="w-full h-full overflow-y-auto">
                        <ul id="hasil" class="w-full p-3 rounded-xl bg-white border border-slate-200 text-[11px] font-black text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                            <li></li>
                        </ul>
                    </div>
                </div>
            </div>
           </section>
        </div>
      </aside>




      <main class="flex-grow bg-slate-100 relative">
        <div id="map" class="w-full h-full"></div>
      </main>
    </div>




    <script type="module" src="./app.js"></script>
  </body>
</html>
